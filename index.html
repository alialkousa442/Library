<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>My Library</h1>
        <button id="addBook">Add New Book</button>
    </header>
    <main id="lib-container">

    </main>
    <dialog id="theForm">
        <form action="" method="dialog" id="form">
            <label for="title">The Title</label>
            <input type="text" id="title" placeholder="the title" required>
            <label for="author">The Author</label>
            <input type="text" id="author" placeholder="the author" required>
            <label for="nump">Pages Number</label>
            <input type="number" min="1" id="nump" placeholder="Pages number">
            <label for="about">About the Book</label>
            <input type="text" id="about" placeholder="about the book" >
            <label for="check">Read Status</label>
            <input type="checkbox" id="check">
            <button type="submit">Add Book</button>
            <button id="cancel" type="button">Cancel </button>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>

</html>
